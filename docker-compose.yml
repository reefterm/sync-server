# Minimal self-host setup: one container, one named volume for the SQLite
# file. `docker compose up -d` is the whole installation.
services:
  sync:
    build: .
    # Or, once images are published: image: ghcr.io/reefterm/sync-server:latest
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - reefterm-sync-data:/data
    environment:
      # Set to false once you and whoever else needs an account have
      # registered, to close the server to new signups.
      REEFTERM_SYNC_ALLOW_REGISTRATION: "true"
      # Optional: enables email-based account recovery (a forgotten
      # passphrase with no device left signed in). Leave unset to run
      # without it. See README.md for the full list of SMTP variables,
      # including REEFTERM_SYNC_SMTP_TLS for providers on port 465 or a
      # relay with no TLS at all.
      # REEFTERM_SYNC_SMTP_HOST: smtp.zeptomail.com
      # REEFTERM_SYNC_SMTP_PORT: "587"
      # REEFTERM_SYNC_SMTP_USERNAME: emailapikey
      # REEFTERM_SYNC_SMTP_PASSWORD: your-smtp-token
      # REEFTERM_SYNC_SMTP_FROM: "Reef Terminal <noreply@your-domain.com>"
      #
      # No SMTP server and just running this for yourself? This logs
      # recovery tokens to the container's console instead of emailing them.
      # Insecure -- only for a single-operator instance you trust the logs
      # of -- and ignored entirely if SMTP is configured above.
      # REEFTERM_SYNC_INSECURE_LOG_RECOVERY_TOKENS: "true"

volumes:
  reefterm-sync-data:
